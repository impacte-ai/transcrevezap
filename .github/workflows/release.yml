name: Release (Production)

on:
  push:
    tags:
      - 'v*'
      - '!v*-dev*'
      - '!v*-rc*'
      - '!v*-beta*'

env:
  IMAGE_NAME: impacteai/transcrevezap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version parts
        id: version
        run: |
          # Tag: v3.0.0.0 → VERSION=3.0.0.0
          FULL="${GITHUB_REF#refs/tags/v}"
          echo "FULL=$FULL" >> $GITHUB_OUTPUT

          # Parse X.Y.Z.W
          IFS='.' read -r X Y Z W <<< "$FULL"
          echo "MAJOR=$X" >> $GITHUB_OUTPUT
          echo "MINOR=$X.$Y" >> $GITHUB_OUTPUT
          echo "PATCH=$X.$Y.$Z" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.FULL }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.PATCH }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.MINOR }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.MAJOR }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          name: "v${{ steps.version.outputs.FULL }}"
          body: |
            ## TranscreveZAP v${{ steps.version.outputs.FULL }}

            **Release de producao** — testada e homologada.

            ### Docker

            ```bash
            # Versao exata (recomendado para producao)
            docker pull impacteai/transcrevezap:${{ steps.version.outputs.FULL }}

            # Recebe hotfixes automaticamente
            docker pull impacteai/transcrevezap:${{ steps.version.outputs.PATCH }}

            # Recebe melhorias automaticamente
            docker pull impacteai/transcrevezap:${{ steps.version.outputs.MINOR }}

            # Sempre a ultima estavel
            docker pull impacteai/transcrevezap:latest
            ```

            ### Tags disponiveis

            | Tag | Descricao | Atualizacao |
            |-----|-----------|-------------|
            | `:${{ steps.version.outputs.FULL }}` | Versao exata | Nunca muda |
            | `:${{ steps.version.outputs.PATCH }}` | Ultimo hotfix da ${{ steps.version.outputs.PATCH }} | Recebe W (fixes) |
            | `:${{ steps.version.outputs.MINOR }}` | Ultima melhoria da ${{ steps.version.outputs.MINOR }} | Recebe Z+W |
            | `:${{ steps.version.outputs.MAJOR }}` | Ultima versao da major ${{ steps.version.outputs.MAJOR }} | Recebe Y+Z+W |
            | `:latest` | Ultima estavel | Sempre atualiza |

            Veja o [CHANGELOG](CHANGELOG.md) para detalhes completos.
