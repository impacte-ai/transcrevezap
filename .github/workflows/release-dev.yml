name: Release (Dev/Canary)

on:
  push:
    tags:
      - 'v*-dev*'
      - 'v*-rc*'
      - 'v*-beta*'

env:
  IMAGE_NAME: impacteai/transcrevezap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          FULL="${GITHUB_REF#refs/tags/v}"
          echo "FULL=$FULL" >> $GITHUB_OUTPUT

          # Detect channel: dev, rc, or beta
          if [[ "$FULL" == *"-dev"* ]]; then
            echo "CHANNEL=dev" >> $GITHUB_OUTPUT
          elif [[ "$FULL" == *"-rc"* ]]; then
            echo "CHANNEL=rc" >> $GITHUB_OUTPUT
          else
            echo "CHANNEL=beta" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.FULL }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.CHANNEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: false
          name: "v${{ steps.version.outputs.FULL }} (Canary)"
          body: |
            ## TranscreveZAP v${{ steps.version.outputs.FULL }} — ${{ steps.version.outputs.CHANNEL }}

            **Release de desenvolvimento** — para testes. Nao recomendado para producao.

            ### Docker

            ```bash
            # Versao exata dev
            docker pull impacteai/transcrevezap:${{ steps.version.outputs.FULL }}

            # Sempre a ultima dev
            docker pull impacteai/transcrevezap:${{ steps.version.outputs.CHANNEL }}
            ```

            ### Tags no Docker Hub

            | Tag | Descricao |
            |-----|-----------|
            | `:${{ steps.version.outputs.FULL }}` | Esta versao exata |
            | `:dev` | Sempre a ultima versao de desenvolvimento |
            | `:rc` | Sempre o ultimo release candidate |
            | `:latest` | Ultima versao **estavel** de producao |

            > Para producao, use sempre `:latest` ou uma versao exata sem sufixo (ex: `:3.0.0.0`).
