name: Release (Dev/Canary)

on:
  push:
    tags:
      - 'v*-dev*'
      - 'v*-rc*'
      - 'v*-beta*'

env:
  IMAGE_NAME: impacteai/transcrevezap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          make_latest: false
          name: "v${{ steps.version.outputs.VERSION }} (Canary)"
          body: |
            ## TranscreveZAP v${{ steps.version.outputs.VERSION }} — Canary

            **Release de desenvolvimento** — para testes. Nao usar em producao.

            ### Docker
            ```bash
            docker pull impacteai/transcrevezap:${{ steps.version.outputs.VERSION }}
            # ou
            docker pull impacteai/transcrevezap:dev
            ```

            ### Diferenca entre tags
            - `:dev` — sempre a ultima versao de desenvolvimento
            - `:latest` — sempre a ultima versao estavel de producao
            - `:X.Y.Z.W` — versao especifica de producao
            - `:X.Y.Z.W-devN` — versao especifica de desenvolvimento
